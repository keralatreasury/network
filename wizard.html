// ============================================================
//  IMAGE COMPRESSION & CONVERSION
// ============================================================
function compressImage(imageData, isColor = true, quality = 0.5) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const maxWidth = 800;
      const maxHeight = 600;
      let width = img.width;
      let height = img.height;
      
      if (width > maxWidth) {
        height = (height * maxWidth) / width;
        width = maxWidth;
      }
      if (height > maxHeight) {
        width = (width * maxHeight) / height;
        height = maxHeight;
      }
      
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      
      // Apply color or grayscale
      if (!isColor) {
        ctx.filter = 'grayscale(100%)';
      }
      
      ctx.drawImage(img, 0, 0, width, height);
      
      // Get compressed data URL
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      resolve(dataUrl);
    };
    img.src = imageData;
  });
}

function cropImage(imageData, cropRect) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const width = cropRect.w;
      const height = cropRect.h;
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, cropRect.x, cropRect.y, width, height, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', 0.9));
    };
    img.src = imageData;
  });
}

  try {
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-IN', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
    
    const payload = {
      action: 'ADD_TROUBLESHOOTING',
      date: dateStr,
      time: timeStr,
      branch: currentBranch || 'Unknown',
      os: os || 'Unknown',
      configChecked: 'Yes',
      pingStatus: pingStatus, // 'Ping OK' or 'Ping Not OK'
      screenshot: screenshotData || '' // Base64 image data for column G
    };

    // Silent POST using no-cors mode - fire and forget
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).catch(e => console.warn('Silent log failed:', e));
    
  } catch (e) {
    console.warn('Silent log failed:', e);
  }
}

async function startCamera() {
  try {
    const video = document.getElementById('cameraVideo');
    const constraints = {
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    };
    cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = cameraStream;
    await video.play();
    return true;
  } catch (err) {
    console.error('Camera error:', err);
    Swal.fire({
      icon: 'error',
      title: 'Camera Error',
      text: t('noCamera'),
      confirmButtonText: 'OK'
    });
    return false;
  }
}

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }
  const video = document.getElementById('cameraVideo');
  video.srcObject = null;
}

function captureScreenshot() {
  const video = document.getElementById('cameraVideo');
  const canvas = document.getElementById('cameraCanvas');
  const context = canvas.getContext('2d');
  
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  context.drawImage(video, 0, 0, canvas.width, canvas.height);
  
  const imageData = canvas.toDataURL('image/jpeg', 0.9);
  capturedImageData = imageData;
  
  // Show preview
  const preview = document.getElementById('capturedPreview');
  const img = document.getElementById('capturedImage');
  img.src = imageData;
  preview.style.display = 'block';
  
  // Hide video
  video.style.display = 'none';
  
  // Enable save button
  document.getElementById('saveScreenshotBtn').disabled = false;
  document.getElementById('retakeBtn').style.display = 'inline-block';
  document.getElementById('captureBtn').style.display = 'none';
  
  // Set initial crop to full image
  cropRect = { x: 0, y: 0, w: canvas.width, h: canvas.height };
  updateCropOverlay();
}

function retakeScreenshot() {
  const video = document.getElementById('cameraVideo');
  video.style.display = 'block';
  document.getElementById('capturedPreview').style.display = 'none';
  document.getElementById('saveScreenshotBtn').disabled = true;
  document.getElementById('retakeBtn').style.display = 'none';
  document.getElementById('captureBtn').style.display = 'inline-block';
  capturedImageData = null;
  cropRect = { x: 0, y: 0, w: 0, h: 0 };
}

function updateCropOverlay() {
  const overlay = document.getElementById('cropOverlay');
  if (cropRect.w > 0 && cropRect.h > 0) {
    const video = document.getElementById('cameraVideo');
    const img = document.getElementById('capturedImage');
    const displayElement = video.style.display !== 'none' ? video : img;
    const rect = displayElement.getBoundingClientRect();
    const scaleX = displayElement.naturalWidth ? displayElement.naturalWidth / displayElement.clientWidth : 1;
    const scaleY = displayElement.naturalHeight ? displayElement.naturalHeight / displayElement.clientHeight : 1;
    
    // Update overlay position
    overlay.style.border = '2px dashed rgba(255,255,255,0.9)';
    overlay.style.background = 'rgba(0,0,0,0.3)';
    overlay.style.boxShadow = 'inset 0 0 0 9999px rgba(0,0,0,0.3)';
  }
}

    </div>`;
}

function pingTestScreen() {
  const gw = gatewayIP || '192.168.1.1';
  const isWin = os === 'windows';
  const appName = isWin ? 'Command Prompt' : 'Terminal';
  const shortcutHint = isWin ? t('cmdShortcut') : t('terminalShortcut');
  
  return `<h5 class="mb-3">${t('pingTitle')}</h5>
    <p class="text-muted">${t('enterCommand')} <strong>${appName}</strong></p>
    <div class="code-block">
      <code class="ping-command-display">ping ${gw}</code>
      <a href="#" class="btn-wizard-cta" id="openTerminalCta" data-os="${os}"><i class="bi bi-box-arrow-up-right"></i> ${isWin ? t('openCmd') : t('openTerminal')}</a>
    </div>
    <div class="text-muted small mt-2">${shortcutHint}</div>
    <div class="mt-4 d-flex justify-content-between">
      <button class="btn btn-wizard btn-wizard-outline" id="pingBackBtn">← ${t('previous')}</button>
      <button class="btn btn-wizard btn-wizard-primary" id="pingNextBtn">${t('next')} →</button>
    </div>`;
}

function pingResultScreen() {
  const isWin = os === 'windows';
  const opts = isWin 
    ? [{key:'reply', label:t('replyFrom'), icon:'✅'},{key:'timeout', label:t('timedOut'), icon:'⏱️'},{key:'unreach', label:t('unreachable'), icon:'🚫'}]
    : [{key:'reply', label:t('bytesFrom'), icon:'✅'},{key:'unreach', label:t('unreachable'), icon:'🚫'},{key:'loss', label:t('packetLoss'), icon:'📉'}];
  let cards = opts.map(o => `<div class="col-4"><div class="ping-card ${pingResult===o.key?'selected':''}" data-ping="${o.key}"><div class="ping-icon">${o.icon}</div><div class="small">${o.label}</div></div></div>`).join('');
  
  // Show screenshot requirement with visual feedback
  const hasScreenshot = capturedImageData !== null;
  const screenshotClass = hasScreenshot ? 'screenshot-ok' : 'screenshot-required';
  const screenshotStatus = hasScreenshot ? '✅ Screenshot captured' : '⚠️ Screenshot required <span class="required-field">*</span>';
  
  const screenshotBtn = `<div class="${screenshotClass}" style="padding:10px;border-radius:12px;margin-top:10px;transition:all 0.3s;">
    <div class="d-flex justify-content-between align-items-center">
      <span>${screenshotStatus}</span>
      <button class="btn btn-wizard btn-wizard-cta" id="openCameraBtn"><i class="bi bi-camera"></i> ${t('captureScreenshot')}</button>
    </div>
    ${hasScreenshot ? `<div class="mt-2"><img src="${capturedImageData}" class="screenshot-preview" alt="Screenshot preview"></div>` : ''}
  </div>`;
  
  return `<h5 class="mb-3">${t('pingResult')} <span class="required-field">*</span></h5>
    <div class="row g-2">${cards}</div>
    ${screenshotBtn}
    <div class="mt-4 d-flex justify-content-between">
      <button class="btn btn-wizard btn-wizard-outline" id="pingResBackBtn">← ${t('previous')}</button>
      <button class="btn btn-wizard btn-wizard-primary" id="pingResNextBtn">${t('next')} →</button>
    </div>`;
}

function resultScreen() {
  const success = pingResult === 'reply';
  if (success) {
    return `<div class="text-center"><i class="bi bi-check-circle-fill text-success fs-1"></i><h4 class="text-success">${t('successTitle')}</h4><p>${t('successMsg')}</p>
      <div class="text-start"><strong>${t('possibleCauses')}</strong><ul><li>WAN 1 / WAN 2 link failure</li><li>ISP issue</li><li>Link flapping</li><li>Fiber issue</li></ul>
      <strong>${t('checklist')}</strong><ul><li>☐ ${t('mediaConverter')}</li><li>☐ ${t('ledStatus')}</li><li>☐ ${t('redLed')}</li></ul>
      <div class="warning-card mt-2"><i class="bi bi-share"></i> ${t('shareWithNOC')}<br>• ${t('pingResultLabel')}: ${t('replyFrom')}<br>• ${t('mediaConverterStatus')}</div>
      ${capturedImageData ? `<div class="mt-2"><img src="${capturedImageData}" class="screenshot-preview" alt="Ping screenshot"></div>` : ''}
      <button class="btn btn-wizard btn-wizard-success mt-3" id="resultNextBtn">${t('next')} →</button></div>
    </div>`;
  } else {
    return `<div class="text-center"><i class="bi bi-x-circle-fill text-danger fs-1"></i><h4 class="text-danger">${t('failureTitle')}</h4><p>${t('failureMsg')}</p>
      <div class="text-start"><ol>${t('failureSteps').map(s=>`<li>${s}</li>`).join('')}</ol>
      <div class="alert alert-danger">${t('contactNOC')}</div>
      ${capturedImageData ? `<div class="mt-2"><img src="${capturedImageData}" class="screenshot-preview" alt="Ping screenshot"></div>` : ''}
      <button class="btn btn-wizard btn-wizard-danger mt-3" id="resultNextBtn">${t('next')} →</button></div>
    </div>`;
  }
}

function finalScreen() {
  return `<div class="text-center"><i class="bi bi-headset fs-1 text-primary"></i><h5>${t('needMoreHelp')}</h5>
    <div class="contact-card mt-3">
      <p class="mb-2"><i class="bi bi-telephone text-primary"></i> <strong>${t('phone')}:</strong> 0471 - 2322533 (ext: 410)</p>
      <p class="mb-0"><i class="bi bi-envelope text-primary"></i> <strong>${t('email')}:</strong> network.treasury@supportgov.nic.in</p>
    </div>
    <button class="finish-btn mt-4" id="finishBtn"><i class="bi bi-check-circle"></i> ${t('finish')}</button>
  </div>`;
}

// ============================================================
//  EVENT BINDING
// ============================================================
function bindEvents() {
  // Branch
  const sel = document.getElementById('branchSelect');
  if (sel) {
    sel.onchange = () => { 
      currentBranch = sel.value; 
      gatewayIP = getGatewayFromBranch(currentBranch); 
      const ipText = document.getElementById('gatewayIpText');
      if (ipText) ipText.innerText = gatewayIP || t('gatewayNotAvailable');
    };
  }
  document.getElementById('branchNextBtn')?.addEventListener('click', () => { 
    if (!currentBranch) { Swal.fire(t('selectBranchFirst')); return; } 
    step=1; render(); 
  });

  // OS
  document.querySelectorAll('.os-card[data-os]').forEach(el => {
    el.onclick = () => { os = el.dataset.os; localStorage.setItem('wizardOS', os); render(); };
  });
  document.getElementById('osBackBtn')?.addEventListener('click', () => { step=0; render(); });
  document.getElementById('osNextBtn')?.addEventListener('click', () => { 
    if (!os) { Swal.fire(t('selectOsFirst')); return; } 
    step=2; render(); 
  });

  // IP config
  document.getElementById('ipBackBtn')?.addEventListener('click', () => { step=1; render(); });
  document.getElementById('ipNextBtn')?.addEventListener('click', () => { step=3; render(); });

  // Ping test - open terminal/CMD
  document.querySelectorAll('#openTerminalCta, #openTerminalCtaFinal').forEach(el => {
    el?.addEventListener('click', (e) => {
      e.preventDefault();
      const isWindows = el.dataset.os === 'windows';
      const title = isWindows ? 'Open Command Prompt' : 'Open Terminal';
      const shortcut = isWindows ? 'Press <kbd>Win</kbd> + <kbd>R</kbd> and type <code>cmd</code>' : 'Press <kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>T</kbd> to open Terminal';
      Swal.fire({
        icon: 'info',
        title: title,
        html: shortcut,
        confirmButtonText: 'OK'
      });
    });
  });

  document.getElementById('pingBackBtn')?.addEventListener('click', () => { step=2; render(); });
  document.getElementById('pingNextBtn')?.addEventListener('click', () => { step=4; render(); });

  // Ping result - with camera and silent log
  document.querySelectorAll('.ping-card[data-ping]').forEach(el => {
    el.onclick = () => { pingResult = el.dataset.ping; render(); };
  });
  
  // Camera button
  document.getElementById('openCameraBtn')?.addEventListener('click', async () => {
    const modal = new bootstrap.Modal(document.getElementById('cameraModal'));
    modal.show();
    await startCamera();
  });
  
  // Camera controls
  document.getElementById('captureBtn')?.addEventListener('click', captureScreenshot);
  document.getElementById('retakeBtn')?.addEventListener('click', retakeScreenshot);
  
  document.getElementById('toggleColorBtn')?.addEventListener('click', () => {
    isColorMode = !isColorMode;
    document.getElementById('toggleColorBtn').textContent = isColorMode ? 'B&W' : 'Color';
    if (capturedImageData) {
      // Re-render preview with color mode change
      const img = document.getElementById('capturedImage');
      compressImage(capturedImageData, isColorMode, 0.5).then(compressed => {
        img.src = compressed;
        capturedImageData = compressed;
      });
    }
  });
  
  document.getElementById('saveScreenshotBtn')?.addEventListener('click', async () => {
    if (!capturedImageData) return;
    
    // Compress and save
    const compressed = await compressImage(capturedImageData, isColorMode, 0.5);
    capturedImageData = compressed;
    
    // Update preview in ping result screen
    const modal = bootstrap.Modal.getInstance(document.getElementById('cameraModal'));
    modal.hide();
    stopCamera();
    
    // Re-render to show preview
    render();
    
    Swal.fire({
      icon: 'success',
      title: t('screenshotSaved'),
      timer: 1500,
      showConfirmButton: false
    });
  });
  
  document.getElementById('cancelCameraBtn')?.addEventListener('click', () => {
    stopCamera();
  });
  
  // Close modal cleanup
  document.getElementById('cameraModal')?.addEventListener('hidden.bs.modal', () => {
    stopCamera();
    // Reset camera UI
    const video = document.getElementById('cameraVideo');
    video.style.display = 'block';
    document.getElementById('capturedPreview').style.display = 'none';
    document.getElementById('saveScreenshotBtn').disabled = true;
    document.getElementById('retakeBtn').style.display = 'none';
    document.getElementById('captureBtn').style.display = 'inline-block';
  });
  
  document.getElementById('pingResBackBtn')?.addEventListener('click', () => { step=3; render(); });
  
  document.getElementById('pingResNextBtn')?.addEventListener('click', () => { 
    if (!pingResult) { 
      Swal.fire(t('selectPingResult')); 
      return; 
    }
    
    // CHECK: Screenshot is now required
    if (!capturedImageData) {
      Swal.fire({
        icon: 'warning',
        title: 'Screenshot Required',
        text: t('selectScreenshot'),
        confirmButtonText: 'OK'
      });
      return;
    }
    
    // Determine ping status
    const pingStatus = pingResult === 'reply' ? 'Ping OK' : 'Ping Not OK';
    
    // Silent log to Google Sheet with screenshot if available
    logTroubleshootingData(pingStatus, capturedImageData || null);
    
    // Immediately go to next step without waiting
    step=5; 
    render(); 
  });

  // Result -> final
  document.getElementById('resultNextBtn')?.addEventListener('click', () => { step=6; render(); });

  // Finish button - restarts wizard
  document.getElementById('finishBtn')?.addEventListener('click', () => { 
    Swal.fire({
      icon: 'success',
      title: 'Troubleshooting Complete',
      text: 'You can restart the wizard anytime.',
      confirmButtonText: 'OK'
    }).then(() => {
      step = 0;
      pingResult = null;
      capturedImageData = null;
      render();
    });
  });
}

// ============================================================
//  INIT
// ============================================================
(async function init() {
  await fetchBranchData();
  
  // Get branch from storage (like reference HTML)
  const storedBranch = getBranchFromStorage();
  if (storedBranch) {
    currentBranch = storedBranch;
    gatewayIP = getGatewayFromBranch(storedBranch);
  }
  
  render();
})();
</script>
